# ER-CAG — SMOKE config (end-to-end production smoke test).
#
# Identical to configs/training/ercag_production.yaml EXCEPT model_name and
# output_dir (routed to outputs/smoke/). reward / model / action representation /
# optimizer logic / grpo hyperparameters are UNCHANGED. max_steps and rollout k
# are already at smoke scale (20 / 4); no further reduction is applied.
#
# Consumed by: eval/r2c_joint_rl_smoke.py (config-aware)
# Launcher:    scripts/05_train_ercag.sh --config configs/smoke/ercag_smoke.yaml

model_name: ercag_smoke_v0
output_dir: ${CAUSALWAM_ROOT}/outputs/smoke/ercag_smoke

# Task identity.
task: turn_switch
prompt: "turn on the switch"

# Policy checkpoint (VAM backbone + trainable action head) + statistics.
diffusion_model:
  model_path: ${CAUSALWAM_ROOT}/checkpoints/pbb2_turn_switch/step_802
statistics_file: ${CAUSALWAM_ROOT}/datasets/tau0_robotwin_success_v3_lerobot/turn_switch/statistics_relative_v2.json

# Frozen world model (native future hook -> Zhat) on cuda:1.
simulator:
  model_path: ${CAUSALWAM_ROOT}/checkpoints/tau0_wm/simulator/diffusion_pytorch_model.bin

# Official reward contract (unchanged).
reward:
  module: ercag.official_reward
  source: ${CAUSALWAM_ROOT}/outputs/v3b0_outcome_contract/sign_probe_results.jsonl
  contract: "r_t = float(check_success()) in {0,1} (real RoboTwin outcome, V3-B0 sign probe)"

# Snapshot / candidate / hold inputs (generated by scripts/prepare_ercag_snapshots.sh).
snapshot:
  dir: ${CAUSALWAM_ROOT}/outputs/v3b0_outcome_contract/native_snapshots
  candidates_jsonl: ${CAUSALWAM_ROOT}/outputs/v3b1_acvs_positive_neutral/tau_candidates/candidates.jsonl
  hold_actions_json: ${CAUSALWAM_ROOT}/outputs/v3b1_acvs_positive_neutral/tau_candidates/hold_actions.json

# Rollout default (snapshot + candidate count).
rollout:
  snapshot: S0

# Flow-GRPO SDE sampler.
flow_grpo:
  num_inference_steps: 5
  execution_steps: 33
  acvs_inference_steps: 10
  shift: 1.0
  sde_seeds: [7000, 7001, 7002, 7003, 7004, 7005, 7006, 7007]

# Shared ValueHead optimizer (fresh init each run).
value_optimizer:
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-5

# Policy optimizer (True Flow-GRPO / FG-B selection).
policy_optimizer:
  lr: 1.0e-6
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  eps: 1.0e-8

# GRPO hyperparameters (Wan2.1 True Flow-GRPO; beta_kl=0 critic-free).
grpo:
  clip_range: 1.0e-3
  adv_clip_max: 5.0
  beta_kl: 0.0
  max_grad_norm: 1.0
  adv_eps: 1.0e-6

# SMOKE iteration budget.
training:
  k: 4
  max_steps: 20
  note: "SMOKE: 20 joint-RL iterations"
