# Vanilla Tau0 + Flow-GRPO — SMOKE config (end-to-end production smoke test).
#
# Identical to configs/training/vanilla_production.yaml EXCEPT model_name and
# output_dir (routed to outputs/smoke/). reward / model / action representation /
# optimizer logic / grpo hyperparameters are UNCHANGED. max_steps and rollout k
# are already at smoke scale (20 / 4); no further reduction is applied.
#
# Consumed by: flow_grpo/tau_vanilla_grpo_production.py
# Launcher:    scripts/04_train_vanilla.sh --config configs/smoke/vanilla_smoke.yaml

model_name: vanilla_smoke_v0
output_dir: ${CAUSALWAM_ROOT}/outputs/smoke/vanilla_smoke

# Task identity (drives the official instruction lookup via RoboTwin metadata).
task: turn_switch

# Policy checkpoint + normalization statistics (migrated KEEP artifacts).
diffusion_model:
  model_path: ${CAUSALWAM_ROOT}/checkpoints/pbb2_turn_switch/step_802
statistics_file: ${CAUSALWAM_ROOT}/datasets/tau0_robotwin_success_v3_lerobot/turn_switch/statistics_relative_v2.json
action_type: relative
action_space: eef6d

# Official reward contract (unchanged).
reward:
  module: ercag.official_reward
  source: ${CAUSALWAM_ROOT}/outputs/v3b0_outcome_contract/sign_probe_results.jsonl
  contract: "r_t = float(check_success()) in {0,1} (real RoboTwin outcome, recorded by V3-B0 sign probe)"

# Real-RoboTwin rollout inputs (generated by scripts/prepare_ercag_snapshots.sh).
rollout:
  snapshot: S0
  native_snapshots_dir: ${CAUSALWAM_ROOT}/outputs/v3b0_outcome_contract/native_snapshots
  candidates_jsonl: ${CAUSALWAM_ROOT}/outputs/v3b1_acvs_positive_neutral/tau_candidates/candidates.jsonl

# Flow-GRPO SDE sampler (deterministic seeds 7000-7007).
flow_grpo:
  k: 4
  num_inference_steps: 5
  execution_steps: 33
  shift: 1.0
  sde_seeds: [7000, 7001, 7002, 7003, 7004, 7005, 7006, 7007]

# GRPO hyperparameters (Wan2.1 True Flow-GRPO; beta_kl=0 critic-free).
grpo:
  clip_range: 1.0e-3
  adv_clip_max: 5.0
  beta_kl: 0.0
  max_grad_norm: 1.0

# Policy optimizer (True Flow-GRPO / FG-B selection).
optimizer:
  lr: 1.0e-6
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  eps: 1.0e-8

# SMOKE iteration budget.
training:
  max_steps: 20
  note: "SMOKE: 20 GRPO iterations"
