# Vanilla Tau0 + Flow-GRPO baseline — production training config (critic-free).
#
# The formal vanilla RL experiment: True Flow-GRPO (Wan2.1) on the tau0 action
# flow with the official sparse success reward. No critic, no ER-CAG ValueHead,
# no paired counterfactual reference.
#
# Reward contract (§1/§6): r_t = float(check_success()) in {0,1}, read from the
# real-RoboTwin outcome contract (V3-B0 sign probe). No ACVS, no shaping.
# Advantage: group-relative standardization (vanilla GRPO), NOT Q_i - Q_0.
#
# Consumed by: flow_grpo/tau_vanilla_grpo_production.py
# Launcher:    scripts/04_train_vanilla.sh

model_name: vanilla_production_v0
output_dir: ${CAUSALWAM_ROOT}/outputs/vanilla_production_v0

# Task identity (drives the official instruction lookup via RoboTwin metadata).
task: turn_switch

# Policy checkpoint + normalization statistics (migrated KEEP artifacts).
diffusion_model:
  model_path: ${CAUSALWAM_ROOT}/checkpoints/pbb2_turn_switch/step_802
statistics_file: ${CAUSALWAM_ROOT}/datasets/tau0_robotwin_success_v3_lerobot/turn_switch/statistics_relative_v2.json
action_type: relative
action_space: eef6d

# Official reward contract.
reward:
  module: ercag.official_reward
  source: ${CAUSALWAM_ROOT}/outputs/v3b0_outcome_contract/sign_probe_results.jsonl
  contract: "r_t = float(check_success()) in {0,1} (real RoboTwin outcome, recorded by V3-B0 sign probe)"

# Real-RoboTwin rollout inputs (observation + candidate actions for the
# determinism check). These are generated by scripts/prepare_ercag_snapshots.sh.
rollout:
  snapshot: S0
  native_snapshots_dir: ${CAUSALWAM_ROOT}/outputs/v3b0_outcome_contract/native_snapshots
  candidates_jsonl: ${CAUSALWAM_ROOT}/outputs/v3b1_acvs_positive_neutral/tau_candidates/candidates.jsonl

# Flow-GRPO SDE sampler (deterministic seeds 7000-7007).
flow_grpo:
  k: 4
  num_inference_steps: 5
  execution_steps: 33
  shift: 1.0
  sde_seeds: [7000, 7001, 7002, 7003, 7004, 7005, 7006, 7007]

# GRPO hyperparameters (Wan2.1 True Flow-GRPO; beta_kl=0 critic-free).
grpo:
  clip_range: 1.0e-3
  adv_clip_max: 5.0
  beta_kl: 0.0
  max_grad_norm: 1.0

# Policy optimizer (True Flow-GRPO / FG-B selection).
optimizer:
  lr: 1.0e-6
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  eps: 1.0e-8

# Iteration budget. PLACEHOLDER ONLY — the final compute budget is not yet
# fixed; raise at experiment time (this is not a smoke cap).
training:
  max_steps: 20
  note: "compute budget placeholder; final max_steps set at experiment time"
